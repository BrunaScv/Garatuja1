<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATMAN</title>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --grid-info-size: 350px;
      --color-bg-hg: rgb(47, 47, 47);
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      display: grid;
      grid-template-areas:
        "social info   content"
        "footer footer footer";
      grid-template-columns: auto var(--grid-info-size) 1fr;
      grid-template-rows: 1fr 50px;
      gap: .5rem;
      padding: .5rem;
      min-height: 100svh;
      background-color: rgb(24, 24, 24);
    }

    aside {
      display: flex;
      flex-direction: column;
      align-items: center;

      grid-area: info;

      .thumb {
        width: calc(var(--grid-info-size) - 20px);
        height: calc(var(--grid-info-size) - 20px);
        background-color: rgb(10, 8, 8);
        border-radius: 50%;
        flex: none;
        z-index: 2;
        overflow: clip;

        img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
      }

      section {
        background-color: var(--color-bg-hg);
        width: 100%;
        height: 100%;
        margin-top: -4rem;
        padding-top: 4rem;
        z-index: 1;
        clip-path: polygon(0 20px, 0 100%, 100% 100%, 100% 0);
        text-align: center;
        color: white;
        font-size: 2.5rem;
      }
    }

    main {
      grid-area: content;
      position: relative;
      isolation: isolate;
      padding: 2rem;

      h1 {
        font-size: 4rem;
        margin: 0;
        padding: 0;
        text-shadow: 2px 2px 4px rgba(227, 227, 227, 0.5);
        color: rgb(174, 174, 174);
      }
      p {
        font-size: 2rem;
        color: rgb(146, 146, 146);
        text-shadow: 2px 2px 4px rgba(223, 223, 223, 0.5);
      }

      &:before {
        content: "";
        background-color: var(--color-bg-hg);
        position: absolute;
        inset: 0;
        z-index: -1;
        clip-path: polygon(0 calc(var(--grid-info-size) - 5.3rem),
            0 100%,
            100% 100%,
            100% calc(var(--grid-info-size) - 10rem));
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        grid-auto-rows: minmax(180px, 230px);
        gap: .5rem;

        img {
          width: 100%;
          height: 100%;
          object-fit: cover;
        }

        :first-child {
          grid-column: span 3;
          grid-row: span 2;
        }
      }
    }

    .social {
      grid-area: social;

      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      
      img {
        width: 2rem;
        height: 2rem;
        object-fit: cover;
        background-color: rgb(174, 174, 174);
      }
    }

    footer {
      grid-area: footer;
    }
  </style>
</head>

<body>
  <aside>
    <div class="thumb">

    </div>
    <section>BATMAN</section>

  <main>
